<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="百店入口網 — 匯集100家優質店家，餐飲美食、零售購物、生活服務應有盡有。" />
  <title>百店入口網 | 優質店家平台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='35' width='60' height='45' rx='4' fill='%231a73e8'/%3E%3Cpath d='M30 35 Q30 20 50 20 Q70 20 70 35' fill='none' stroke='%231a73e8' stroke-width='4'/%3E%3Ccircle cx='50' cy='55' r='8' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav id="navbar" class="navbar">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">
        <span class="logo-icon">&#128722;</span>
        <span class="logo-text">百店入口網</span>
      </a>
      <div class="nav-search">
        <input type="text" id="searchInput" placeholder="搜尋店家名稱、分類、地區..." autocomplete="off" />
        <span class="search-icon">&#128269;</span>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ===== Hero ===== -->
  <section id="hero" class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">百店入口網</h1>
      <p class="hero-subtitle">匯集 100 家優質店家，一個平台滿足您所有需求</p>
      <div class="hero-search">
        <input type="text" id="heroSearchInput" placeholder="輸入店家名稱、分類或地區..." />
        <button id="heroSearchBtn" class="btn btn-primary">搜尋</button>
      </div>
      <div class="hero-stats" id="heroStats">
        <div class="hero-stat"><span class="hero-stat-num" id="statTotal">0</span><span class="hero-stat-label">店家總數</span></div>
        <div class="hero-stat"><span class="hero-stat-num" id="statCategories">0</span><span class="hero-stat-label">分類數</span></div>
        <div class="hero-stat"><span class="hero-stat-num" id="statCities">0</span><span class="hero-stat-label">地區數</span></div>
      </div>
    </div>
  </section>

  <!-- ===== Category Filter Bar ===== -->
  <section class="filter-bar" id="filterBar">
    <div class="container">
      <div class="filter-scroll">
        <button class="filter-chip active" data-category="all">全部</button>
        <button class="filter-chip" data-category="餐飲美食">餐飲美食</button>
        <button class="filter-chip" data-category="零售購物">零售購物</button>
        <button class="filter-chip" data-category="美容美髮">美容美髮</button>
        <button class="filter-chip" data-category="生活服務">生活服務</button>
        <button class="filter-chip" data-category="醫療保健">醫療保健</button>
        <button class="filter-chip" data-category="教育學習">教育學習</button>
        <button class="filter-chip" data-category="休閒娛樂">休閒娛樂</button>
        <button class="filter-chip" data-category="電子科技">電子科技</button>
        <button class="filter-chip" data-category="家居裝潢">家居裝潢</button>
        <button class="filter-chip" data-category="交通旅遊">交通旅遊</button>
      </div>
    </div>
  </section>

  <!-- ===== Main Content ===== -->
  <main class="main-content">
    <div class="container">
      <div class="content-header">
        <h2 id="resultTitle">所有店家</h2>
        <span class="result-count" id="resultCount">載入中...</span>
      </div>

      <!-- Store Grid -->
      <div class="store-grid" id="storeGrid">
        <div class="loading-message">正在載入店家資料...</div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>

      <!-- No Results -->
      <div class="no-results" id="noResults" style="display:none;">
        <span class="no-results-icon">&#128533;</span>
        <p>找不到符合條件的店家</p>
        <p class="no-results-hint">請嘗試其他關鍵字或分類</p>
      </div>
    </div>
  </main>

  <!-- ===== Store Detail Modal ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="storeModal">
      <button class="modal-close" id="modalClose" aria-label="關閉">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
          <h3>&#128722; 百店入口網</h3>
          <p>匯集100家優質店家的入口平台，涵蓋餐飲、零售、服務等各類店家，讓您輕鬆找到所需。</p>
        </div>
        <div class="footer-info">
          <h4>關於平台</h4>
          <p>本平台為靜態網站，店家資料以 JSON 格式儲存，由 JavaScript 動態讀取渲染。</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 百店入口網. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- ===== Floating: Back to Top + Social Quick Links ===== -->
  <div class="floating-tools" id="floatingTools">
    <div class="social-quick-links" id="socialQuickLinks">

      </a>
      <a href="https://facebook.com" target="_blank" rel="noopener" class="social-link social-fb" aria-label="Facebook 連結">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.52c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>

      </a>
    </div>
    <button class="back-to-top" id="backToTop" aria-label="回到頂端">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
